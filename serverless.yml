service: cognito-training

frameworkVersion: '3'

plugins:
  - serverless-offline

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002

  commonTags:
    project: cognito-training
    environment: ${self:custom.stage}

  # tableName: 'user-table-${self:custom.stage}'

provider:
  name: aws
  runtime: python3.9
  region: ${self:custom.region}
  stage: ${self:custom.stage}
  profile: ${opt:aws-profile, 'dev'}
  memorySize: 256
  timeout: 15

  #Tags the CloudFormation stack itself
  stackTags: ${self:custom.commonTags}

  # Tags every individual taggable resource (Lambda functions, the
  # auto-generated IAM role, etc.)
  tags: ${self:custom.commonTags}

  # Environment variables available to all functions
  environment:
    STAGE: ${self:custom.stage}
    TABLE_NAME: ${self:service}-${self:provider.stage}-sso-training
    COGNITO_CLIENT_ID: "3bt8targ9a8ikpi7fn302jugct" # TODO do not hardcoded it - move to env

  # http:
  #   cors: true

  iam:
    role: arn:aws:iam::710318463284:role/dac-uag2-lambda-execution-role-develop
  # iam:
  #   role:
  #     statements:
  #       - Effect: Allow
  #         Action:
  #           - dynamodb:PutItem
  #           - dynamodb:GetItem
  #           - dynamodb:UpdateItem
  #           - dynamodb:Query
  #         Resource:
  #           - !GetAtt UserProfileTable.Arn
  #           - !Sub '${UserProfileTable.Arn}/index/*'

functions:
  preSignUp:
    handler: src/preSignUp.handler

  postConfirmation:
    handler: src/postConfirmation.handler

  preAuthentication:
    handler: src/preAuthentication.handler

  postAuthentication:
    handler: src/postAuthentication.handler

  preTokenGeneration:
    handler: src/preTokenGeneration.handler

  loginUser:
    handler: src/auth/login.handler
    events:
      - http:
          path: login
          method: post
          cors: true

  getAllUser:
    handler: src/user/getAllUser.handler
    events:
      - http:
          path: users
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer

  # Sessions API
  postSession:
    handler: src/session/postSession.handler
    events:
      - http:
          path: session
          method: post
          cors: true
    
  getSession:
    handler: src/session/getSession.handler
    events:
      - http:
          path: session/{userId}/{client_app_id}
          method: get
          cors: true

# CloudFormation resource templates here
resources:
  Resources:
    # ---------------------------------------------------------------
    # Authorizer
    # ---------------------------------------------------------------
    ApiGatewayAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: cognito-authorizer
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId:
          Ref: ApiGatewayRestApi
        ProviderARNs:
          - Fn::GetAtt: [CognitoUserPool, Arn]
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
    # ---------------------------------------------------------------
    # Cognito User Pool
    # ---------------------------------------------------------------
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${self:provider.stage}-user-pool
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: given_name
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: family_name
            AttributeDataType: String
            Required: true
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
        LambdaConfig:
          PreSignUp: !GetAtt PreSignUpLambdaFunction.Arn
          PostConfirmation: !GetAtt PostConfirmationLambdaFunction.Arn
          PreAuthentication: !GetAtt PreAuthenticationLambdaFunction.Arn
          PostAuthentication: !GetAtt PostAuthenticationLambdaFunction.Arn
          PreTokenGenerationConfig:
            LambdaVersion: V2_0
            LambdaArn: !GetAtt PreTokenGenerationLambdaFunction.Arn

    # Permissions letting Cognito invoke each trigger
    PreSignUpInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt PreSignUpLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CognitoUserPool.Arn

    PostConfirmationInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt PostConfirmationLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CognitoUserPool.Arn

    PreAuthenticationInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt PreAuthenticationLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CognitoUserPool.Arn

    PostAuthenticationInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt PostAuthenticationLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CognitoUserPool.Arn

    PreTokenGenerationInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt PreTokenGenerationLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CognitoUserPool.Arn

    # ---------------------------------------------------------------
    # App Client (used by Amplify on the Nuxt frontend)
    # ---------------------------------------------------------------
    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${self:provider.stage}-web-client
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH # allows client-side apps to authenticate users by sending plaintext usernames and passwords directly via the API
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH # Typically required to keep sessions alive
        PreventUserExistenceErrors: ENABLED
        AccessTokenValidity: 60
        IdTokenValidity: 60
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days

    # ---------------------------------------------------------------
    # DynamoDB extension table
    # Holds data Cognito doesn't store natively, keyed by Cognito sub
    # ---------------------------------------------------------------
    UserProfileTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_NAME}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

  Outputs:
    UserPoolId:
      Value: !Ref CognitoUserPool
    UserPoolClientId:
      Value: !Ref CognitoUserPoolClient
    UserPoolArn:
      Value: !GetAtt CognitoUserPool.Arn